<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="sm" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="smr" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <style>
      .st { font-size: 14px; font-weight: bold; fill: #0f172a; }
      .sub { font-size: 11.5px; fill: #475569; }
      .lb { font-size: 12px; fill: #1e293b; }
      .lbr { font-size: 12px; fill: #b91c1c; }
      .n { font-size: 12px; fill: #64748b; }
      .e { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#sm); }
      .er { stroke: #b91c1c; stroke-width: 1.4; fill: none; marker-end: url(#smr); stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="800" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">订单状态机（三态主干 + 退款 / 仲裁旁支）</text>
  <text x="540" y="56" text-anchor="middle" class="n">线下交易没有"物流在途"环节，状态做减法：主干只有 3 个状态，资金与结算放 biz_settlement，退款过程放 biz_refund</text>

  <circle cx="42" cy="268" r="8" fill="#0f172a"/>
  <path class="e" d="M50,268 L80,268"/>
  <text x="50" y="256" class="n">下单</text>

  <!-- CLOSED -->
  <rect x="80" y="90" width="190" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="96" y="118" class="st">CLOSED 已关闭</text>
  <text x="96" y="140" class="sub">释放商品回 ON_SALE</text>
  <text x="96" y="157" class="sub">定时任务每 60s 扫描</text>

  <!-- PENDING_PAY -->
  <rect x="80" y="230" width="190" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="96" y="258" class="st">PENDING_PAY</text>
  <text x="96" y="280" class="sub">待支付（最长 5 分钟）</text>
  <text x="96" y="297" class="sub">商品已 LOCKED</text>

  <!-- WAIT_VERIFY -->
  <rect x="360" y="230" width="190" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="376" y="258" class="st">WAIT_VERIFY</text>
  <text x="376" y="280" class="sub">待核销（买家已付款）</text>
  <text x="376" y="297" class="sub">可约见 / 取核销码</text>

  <!-- COMPLETED -->
  <rect x="640" y="230" width="190" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="656" y="258" class="st">COMPLETED</text>
  <text x="656" y="280" class="sub">已完成（卖家已核销）</text>
  <text x="656" y="297" class="sub">可评价 / 7 天内可退款</text>

  <!-- REFUNDING -->
  <rect x="640" y="430" width="190" height="76" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="656" y="458" class="st">REFUNDING</text>
  <text x="656" y="480" class="sub">退款待卖家处理</text>
  <text x="656" y="497" class="sub">biz_refund = PENDING</text>

  <!-- REFUND_AGREED -->
  <rect x="80" y="430" width="190" height="76" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="96" y="458" class="st">REFUND_AGREED</text>
  <text x="96" y="480" class="sub">卖家已同意退货</text>
  <text x="96" y="497" class="sub">需再约一次 RETURN</text>

  <!-- ARBITRATING -->
  <rect x="360" y="560" width="190" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="376" y="588" class="st">ARBITRATING</text>
  <text x="376" y="610" class="sub">平台介入中</text>
  <text x="376" y="627" class="sub">等待管理员判定</text>

  <!-- REFUNDED -->
  <rect x="80" y="620" width="190" height="76" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="96" y="648" class="st">REFUNDED</text>
  <text x="96" y="670" class="sub">已退款（原路退回）</text>
  <text x="96" y="687" class="sub">商品回 ON_SALE</text>

  <!-- 迁移 -->
  <path class="e" d="M175,230 L175,166"/>
  <text x="186" y="206" class="lb">5 分钟未支付 / 买家取消</text>

  <path class="e" d="M270,268 L360,268"/>
  <text x="280" y="258" class="lb">支付成功</text>

  <path class="e" d="M550,268 L640,268"/>
  <text x="556" y="258" class="lb">卖家核销 6 位码</text>
  <text x="556" y="290" class="sub">码 15 分钟有效，需签到照</text>

  <path class="e" d="M735,306 L735,430"/>
  <text x="744" y="352" class="lb">买家申请退款（≤7 天）</text>

  <path class="e" d="M640,468 L270,468"/>
  <text x="300" y="460" class="lb">卖家同意退货</text>

  <path class="e" d="M175,506 L175,620"/>
  <text x="186" y="548" class="lb">退货签到 + 买家确认</text>
  <text x="186" y="566" class="n">→ 原路退款</text>

  <path class="e" d="M735,506 L735,610 L550,610"/>
  <text x="560" y="602" class="lb">卖家拒绝后申请介入</text>

  <path class="e" d="M360,600 L300,600 L300,640 L270,640"/>
  <text x="292" y="594" class="lb">判定卖家责任（强制退款）</text>

  <path class="e" d="M400,560 L400,340 L660,340 L660,306"/>
  <text x="418" y="368" class="lb">判定货物无问题</text>
  <text x="418" y="386" class="n">（终止退货，回已完成）</text>

  <path class="er" d="M700,430 L700,306"/>
  <text x="712" y="400" class="lbr">卖家拒绝退款</text>

  <!-- 状态枚举 -->
  <rect x="880" y="90" width="186" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="894" y="114" class="st" font-size="13">状态枚举（8 个）</text>
  <text x="894" y="138" class="sub">PENDING_PAY 待支付</text>
  <text x="894" y="160" class="sub">WAIT_VERIFY 待核销</text>
  <text x="894" y="182" class="sub">COMPLETED 已完成</text>
  <text x="894" y="204" class="sub">REFUNDING 退款中</text>
  <text x="894" y="226" class="sub">REFUND_AGREED 同意退货</text>
  <text x="894" y="248" class="sub">REFUNDED 已退款</text>
  <text x="894" y="270" class="sub">ARBITRATING 平台介入</text>
  <text x="894" y="292" class="sub">CLOSED 已关闭</text>
  <text x="894" y="322" class="lbr">红色虚线 = 拒绝 / 回滚</text>
  <text x="894" y="344" class="n">黑色实线 = 正常迁移</text>
  <text x="894" y="366" class="n">迁移前置校验在 Service 层</text>
  <text x="894" y="382" class="n">非法迁移统一抛 40900</text>

  <!-- 爽约 -->
  <rect x="600" y="650" width="270" height="130" rx="10" fill="#fefce8" stroke="#facc15"/>
  <text x="614" y="676" class="st" font-size="13">旁支：爽约惩戒（不改订单状态）</text>
  <text x="614" y="700" class="sub">约定时间 +30 分钟未到且未沟通</text>
  <text x="614" y="720" class="sub">→ 对方可上报（biz_no_show）</text>
  <text x="614" y="740" class="sub">→ 被上报方信誉分 −5</text>
  <text x="614" y="760" class="n">信用流水 biz_credit_log(NO_SHOW)</text>
</svg>
