<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="960" viewBox="0 0 1140 960" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="q" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="qd" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="qr" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/>
    </marker>
    <style>
      .actor { font-size: 14px; font-weight: bold; fill: #0f172a; }
      .m { font-size: 12.5px; fill: #1e293b; }
      .m2 { font-size: 11.5px; fill: #475569; }
      .n { font-size: 12px; fill: #64748b; }
      .call { stroke: #1d4ed8; stroke-width: 1.5; fill: none; marker-end: url(#q); }
      .ret { stroke: #0f766e; stroke-width: 1.4; fill: none; marker-end: url(#qr); stroke-dasharray: 6 4; }
      .db { stroke: #7c3aed; stroke-width: 1.4; fill: none; marker-end: url(#qd); }
      .life { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1140" height="960" fill="#ffffff"/>
  <text x="570" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">线下核销交易时序（下单 → 支付 → 取码 → 约见 → 卖家核销）</text>
  <text x="570" y="54" text-anchor="middle" class="n">核销码由买家出示、卖家输入并上传递交照片；状态迁移全部在 Service 层做前置校验，数据库只做条件更新与唯一约束兜底</text>

  <rect x="60" y="76" width="180" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="150" y="100" text-anchor="middle" class="actor">买家（web/）</text>
  <text x="150" y="120" text-anchor="middle" class="m2">Vue3 + Vant4</text>

  <rect x="340" y="76" width="180" height="56" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="430" y="100" text-anchor="middle" class="actor">服务端 OrderService</text>
  <text x="430" y="120" text-anchor="middle" class="m2">Spring Boot 3.2.5 / 8088</text>

  <rect x="620" y="76" width="180" height="56" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="710" y="100" text-anchor="middle" class="actor">数据库</text>
  <text x="710" y="120" text-anchor="middle" class="m2">H2(MODE=MySQL) / MySQL8</text>

  <rect x="900" y="76" width="180" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="990" y="100" text-anchor="middle" class="actor">卖家（web/）</text>
  <text x="990" y="120" text-anchor="middle" class="m2">Vue3 + Vant4</text>

  <line class="life" x1="150" y1="132" x2="150" y2="900"/>
  <line class="life" x1="430" y1="132" x2="430" y2="900"/>
  <line class="life" x1="710" y1="132" x2="710" y2="900"/>
  <line class="life" x1="990" y1="132" x2="990" y2="900"/>

  <path class="call" d="M150,172 L430,172"/>
  <text x="160" y="166" class="m">1. POST /v1/orders { listingId, requestId }</text>

  <path class="db" d="M430,206 L710,206"/>
  <text x="440" y="200" class="m">2. 校验实名 + 学生双认证；幂等 INSERT sys_idempotent(request_id, scene)</text>
  <text x="440" y="221" class="m2">条件更新 biz_listing.status：'ON_SALE' → 'LOCKED'（影响行数 = 1 才继续下单）</text>

  <path class="db" d="M710,252 L430,252"/>
  <text x="440" y="246" class="m">3. INSERT biz_orders(status=PENDING_PAY, expire_at=now+5min)</text>

  <path class="ret" d="M430,284 L150,284"/>
  <text x="160" y="278" class="m">4. code=0，返回订单号 TB2026…</text>

  <path class="call" d="M150,320 L430,320"/>
  <text x="160" y="314" class="m">5. POST /v1/orders/{orderNo}/pay</text>

  <path class="db" d="M430,352 L710,352"/>
  <text x="440" y="346" class="m">6. status=WAIT_VERIFY，写 paid_at（支付渠道 MOCK，预留微信支付）</text>

  <path class="call" d="M150,392 L430,392"/>
  <text x="160" y="386" class="m">7. GET /v1/orders/{orderNo}/verify-code</text>

  <path class="db" d="M430,424 L710,424"/>
  <text x="440" y="418" class="m">8. 生成 6 位随机码，verify_expire_at = now + 15 分钟</text>

  <path class="ret" d="M430,456 L150,456"/>
  <text x="160" y="450" class="m">9. { code: "834917", remainSeconds: 900 }（过期重取换新码）</text>

  <path class="call" d="M990,496 L430,496"/>
  <text x="440" y="490" class="m">10. POST /v1/orders/{orderNo}/meets { meetType: TRADE, place, meetTime }</text>

  <path class="db" d="M430,528 L710,528"/>
  <text x="440" y="522" class="m">11. INSERT biz_meet(status=PROPOSED)</text>

  <path class="call" d="M150,568 L430,568"/>
  <text x="160" y="562" class="m">12. POST /v1/orders/meets/{meetId}/confirm { agreed: true }</text>

  <path class="db" d="M430,600 L710,600"/>
  <text x="440" y="594" class="m">13. biz_meet=CONFIRMED；回写 biz_orders.meet_place / meet_time</text>
  <text x="440" y="615" class="m2">只有"对方"能确认，不能确认自己发起的约见</text>

  <rect x="60" y="640" width="1020" height="40" rx="8" fill="#fefce8" stroke="#facc15"/>
  <text x="76" y="665" class="m">14. —— 线下交易：买家到场，双方核对教材实物（品相、版本、ISBN、页数）——</text>

  <path class="call" d="M990,712 L430,712"/>
  <text x="440" y="706" class="m">15. POST /v1/orders/{orderNo}/verify { code: "834917", signPhotoUrl }</text>

  <path class="db" d="M430,748 L710,748"/>
  <text x="440" y="742" class="m">16. 校验：状态=WAIT_VERIFY、码一致、now ≤ verify_expire_at、操作人=卖家/管理员、签到照非空</text>
  <text x="440" y="766" class="m2">→ 订单 COMPLETED（写 sign_at / sign_photo_url）；商品 listing → SOLD</text>
  <text x="440" y="786" class="m2">→ biz_pickup_verify(SELLER_SIGN, code)；biz_settlement(DONE)；双方信用 +5（DEAL_DONE）</text>

  <path class="ret" d="M430,826 L990,826"/>
  <text x="1000" y="820" class="m">17. 核销成功</text>

  <path class="ret" d="M430,862 L150,862"/>
  <text x="160" y="856" class="m">18. 通知买家（biz_message / msg_notice）→ 可评价</text>

  <rect x="60" y="896" width="1020" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="915" class="n">异常分支：① 15 分钟码过期 → 买家重取（旧码失效）② 未到约定时间上报爽约 → 40900</text>
  <text x="76" y="932" class="n">③ 卖家拒绝退款 → 订单回 COMPLETED ④ 买家申请平台介入 → ARBITRATING → 判定后退款或终止</text>
</svg>
