# 开发环境：H2 文件库，零外部依赖即可启动（答辩/演示默认用这个）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 用文件库而不是内存库：重启后数据还在，演示时不用反复初始化
    url: jdbc:h2:file:./data/textbook_loop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  # 开发期把短信发送间隔压到 3 秒，方便反复跑 tools/smoke.ps1（生产默认 60 秒）
  sms-interval-seconds: 3
  # 短信通道：mock = 验证码打印到日志并随 /v1/auth/sms-code 回传（离线演示用）
  #           spug = 走 Spug 推送助手官方短信验证码模板（需要 app.spug-template-code）
  sms-provider: mock
