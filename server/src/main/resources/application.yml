server:
  port: 8088

spring:
  config:
    # 云市场凭证（AppCode）与本机开关放私有文件；不存在也不报错，仓库里只留占位
    import: optional:classpath:application-market-local.yml
  application:
    name: textbook-loop
  profiles:
    active: dev
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  servlet:
    encoding:
      charset: UTF-8
      force: true
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产默认不打全量 SQL；本地调试可临时改成 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt-secret: ${APP_JWT_SECRET:textbook-loop-dev-secret-change-me-0123456789abcdef}
  jwt-ttl-hours: 168
  # 待支付订单仅维持 5 分钟，超时自动关闭（文档口径）
  order-expire-minutes: 5
  commission-rate: 0.05
  # 运营推广提成比例：下线订单核销完成后按成交额计提
  promoter-rate: ${APP_PROMOTER_RATE:0.01}
  # 图片/视频上传落盘目录（相对进程工作目录）
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  verify-secret: ${APP_VERIFY_SECRET:textbook-loop-verify-secret-0123456789}
  verify-window-seconds: 30
  verify-code-ttl-minutes: 15
  sms-code-ttl-seconds: 300
  # 短信通道：mock（默认，验证码回传）| spug（Spug 推送助手短信验证码）
  sms-provider: ${APP_SMS_PROVIDER:mock}
  # Spug 模板编码：控制台「短信验证码 → 模板详情」里调用 URL 的 /sms/<这一串>
  spug-template-code: ${APP_SPUG_TEMPLATE_CODE:}
  spug-base-url: ${APP_SPUG_BASE_URL:https://push.spug.cc}
  spug-timeout-seconds: 8
  mock-identity: ${APP_MOCK_IDENTITY:true}
  # 实名核验通道：mock（GB11643 本地校验）| aliyun（阿里云云市场身份证二要素）
  identity-provider: ${APP_IDENTITY_PROVIDER:mock}
  aliyun-market-appcode: ${ALIYUN_MARKET_APPCODE:}
  aliyun-market-idcheck-url: ${ALIYUN_MARKET_IDCHECK_URL:https://verifytwo.market.alicloudapi.com/identity/verify_id_name}
  # ISBN 元数据通道：mock（只查本地教材库）| market（阿里云云市场 ISBN 标准书号查询）
  isbn-provider: ${APP_ISBN_PROVIDER:mock}
  aliyun-market-isbn-url: ${ALIYUN_MARKET_ISBN_URL:https://lhisbnshcx.market.alicloudapi.com/isbn/query}
  realname-timeout-seconds: 8
  # 允许跨域的前端来源（逗号分隔）；生产同源部署配空即可
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

logging:
  level:
    com.textbook.loop: info
